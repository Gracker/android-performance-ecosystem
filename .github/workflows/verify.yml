name: Verify ecosystem

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate catalog and generated snippets
        run: python scripts/ecosystem.py validate
      - name: Check public README copies
        if: github.event_name != 'pull_request'
        run: python scripts/ecosystem.py check-readmes --remote
